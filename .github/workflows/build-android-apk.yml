name: Build Android APK

on:
  push:
    branches:
      - main
      - arena/01a08510-telegram-drive
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_DIR: Telegram-Drive-Androidv4.0.0beta/app
      ANDROID_HOME: /tmp/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust with Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Android SDK and NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms"

      - name: Install JS dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Type-check
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Tauri Android init
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri -- android init

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri -- android build --debug --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-android-apk
          path: Telegram-Drive-Androidv4.0.0beta/app/src-tauri/gen/android/**/*.apk
          if-no-files-found: error
          retention-days: 14
